[package]
name = "pathhydra-api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["pathhydra-engine/cuda"]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
pathhydra-core = { path = "../pathhydra-core" }
pathhydra-engine = { path = "../pathhydra-engine" }
pathhydra-routing = { path = "../pathhydra-routing" }
pathhydra-store = { path = "../pathhydra-store" }
pathhydra-subgraph = { path = "../pathhydra-subgraph" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
tempfile = "3.21.0"

[lints]
workspace = true
