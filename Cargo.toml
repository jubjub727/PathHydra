[workspace]
resolver = "3"
members = [
    "crates/pathhydra-admin",
    "crates/pathhydra-api",
    "crates/pathhydra-core",
    "crates/pathhydra-bench",
    "crates/pathhydra-cuda",
    "crates/pathhydra-engine",
    "crates/pathhydra-routing",
    "crates/pathhydra-store",
    "crates/pathhydra-subgraph",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
